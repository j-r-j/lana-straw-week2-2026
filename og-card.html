<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<!-- Source for og-image.jpg (1200x630 share card). Render: python3 build.py --og -->
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: #0c1016; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 78% 40%, #2a1418 0%, #0c1016 62%); color: #f3eee4;
    font-family: Georgia, "Times New Roman", serif; }
  .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #8a1a28; }
  .inner { position: absolute; left: 62px; top: 50px; bottom: 44px; width: 600px;
    display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 900;
    letter-spacing: .3em; text-transform: uppercase; font-size: 19px; }
  .issue { margin-top: 8px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; font-size: 14px; color: #d4b56a; }
  h1 { margin: 34px 0 0; font-size: 80px; line-height: .9; font-weight: 900; letter-spacing: -.035em; }
  h1 em { color: #d4b56a; font-style: italic; }
  .dek { margin: 20px 0 0; font-size: 25px; line-height: 1.3; font-style: italic; color: #e8e0d4; max-width: 560px; }
  .tags { display: flex; gap: 10px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .tags span { border: 1.5px solid rgba(243,238,228,.4); padding: 6px 11px; font-size: 13px; font-weight: 800;
    letter-spacing: .12em; text-transform: uppercase; }
  .tags span.hot { background: #8a1a28; border-color: #8a1a28; }
  .letter { position: absolute; right: 70px; top: 36px; width: 360px; height: 470px;
    transform: rotate(4deg); box-shadow: 0 24px 60px rgba(0,0,0,.6); background: #fff; padding: 10px; }
  .letter img { width: 100%; height: 100%; object-fit: cover; object-position: center 6%; display: block; }
  .pin { position: absolute; right: 243px; top: 22px; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff6b6b, #8a1a28 70%); box-shadow: 0 4px 8px rgba(0,0,0,.5); z-index: 3; }
  .polaroid { position: absolute; right: 330px; bottom: 34px; width: 190px; background: #fbfaf5; padding: 10px 10px 34px;
    transform: rotate(-7deg); box-shadow: 0 18px 44px rgba(0,0,0,.65); z-index: 2; }
  .polaroid img { width: 100%; height: 210px; object-fit: cover; object-position: center 35%; display: block; }
  .polaroid .cap { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #1f2d6b;
    font-family: "Bradley Hand", "Marker Felt", cursive; font-size: 18px; }
  .stamp { position: absolute; right: 44px; bottom: 40px; width: 150px; height: 150px; border-radius: 50%;
    border: 4px solid #d4b56a; color: #d4b56a; transform: rotate(-12deg); z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: rgba(12,16,22,.85); }
  .stamp b { font-size: 50px; line-height: 1; font-weight: 900; letter-spacing: -.03em; }
  .stamp small { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="rail"></div>
    <div class="inner">
      <div>
        <div class="brand">Lana Straw Weekly</div>
        <div class="issue">Week 2 &#183; 2026</div>
        <h1>MAYBE YOU SHOULD MAKE <em>SUME TRADES?</em></h1>
        <p class="dek">Boom Baum is 0-2 and asked for forty-five trades. The league sent him a letter from a child.</p>
      </div>
      <div class="tags"><span class="hot">#Pointgate</span><span>Bijan, again</span><span>Double tap the zero</span></div>
    </div>
    <div class="pin"></div>
    <div class="letter"><img src="assets/wire_otter.jpg" alt=""/></div>
    <div class="polaroid"><img src="assets/wire_boom_breakfast.jpg" alt=""/><div class="cap">the reading</div></div>
    <div class="stamp"><b>0-2</b><small>Boom Baum</small></div>
  </div>
</body>
</html>
