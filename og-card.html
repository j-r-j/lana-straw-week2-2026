<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative;
    font-family: Georgia, "Times New Roman", serif;
    color: #f4f1ea; background: #0b0b0b;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(11,11,11,.92) 0%, rgba(11,11,11,.62) 52%, rgba(11,11,11,.28) 100%),
      url("assets/print/google-photos/11-stone-cold-fart-toot.jpg") center 22% / cover no-repeat;
  }
  .rail {
    position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #8b1e1e;
  }
  .inner {
    position: relative; z-index: 1;
    height: 100%; box-sizing: border-box;
    padding: 54px 64px 48px;
    display: flex; flex-direction: column; justify-content: space-between;
    max-width: 760px;
  }
  .brand {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: .22em; text-transform: uppercase;
    font-size: 18px; color: #c9a227; font-weight: 700;
  }
  .issue {
    margin-top: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: .14em; text-transform: uppercase;
    font-size: 14px; color: #d7d0c4;
  }
  h1 {
    margin: 28px 0 0; font-size: 78px; line-height: .92;
    font-weight: 700; letter-spacing: -.02em;
    text-shadow: 0 2px 24px rgba(0,0,0,.55);
  }
  .dek {
    margin-top: 22px; font-size: 26px; line-height: 1.28;
    color: #e8e0d4; max-width: 20em;
    text-shadow: 0 1px 12px rgba(0,0,0,.45);
  }
  .foot {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: .12em; text-transform: uppercase;
    font-size: 13px; color: #9a9286;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="rail"></div>
    <div class="inner">
      <div>
        <div class="brand">Lana Straw Weekly</div>
        <div class="issue">Week 2 &#183; 2026 &#183; The Straw</div>
        <h1>THE REIGN<br/>IS 0-2</h1>
        <p class="dek">All Gold filed 152.14. Fart Toot scored 78.50. Madison Beer lived by 2.58.</p>
      </div>
      <div class="foot">9-page issue &#183; Read online or download PDF</div>
    </div>
  </div>
</body>
</html>
